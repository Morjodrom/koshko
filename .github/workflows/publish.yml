name: Publish packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish to release packages to npm
        required: true
        type: string

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:apps
      - run: npm run pack:packages
      - run: npm run smoke:packages
      - run: npm run release:packages
